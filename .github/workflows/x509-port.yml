# Fork-only: fast feedback for the certificate verification port (eclipse-score/inc_security_crypto#251).
name: X.509 port (fork)

on:
  push:
    branches:
      - feat/x509-backend
  workflow_dispatch:

jobs:
  tests:
    name: Certificate targets (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default backend
            bazel-target: "test //score/crypto/src/daemon/provider/... //score/crypto/src/daemon/cert_management/... --config=x86_64-linux"
          - name: openssl provider
            bazel-target: "test //score/crypto/src/daemon/provider/... //score/crypto/src/daemon/cert_management/... --config=x86_64-linux --//score/crypto/src/backend:score_crypto_pkcs11_backend_enabled=False"
    uses: eclipse-score/cicd-workflows/.github/workflows/tests.yml@7e8ea4c61756b931622ff979835469b93b162920
    with:
      bazel-target: ${{ matrix.bazel-target }}
      upload-name: "NO UPLOAD OF TEST RESULTS CONFIGURED"
